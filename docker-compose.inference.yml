version: '3.8'

services:
  vllm:
    image: vllm/vllm-openai:latest
    ports:
      - "8001:8000"
    command: --model "Qwen/Qwen2.5-0.5B-Instruct" --host 0.0.0.0 --max-model-len 2048 --gpu-memory-utilization 0.5
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    volumes:
      - ~/.cache/huggingface:/root/.cache/huggingface

  sglang:
    image: lmsysorg/sglang:latest
    ports:
      - "8002:30000"
    command: python3 -m sglang.launch_server --model-path "Qwen/Qwen2.5-0.5B-Instruct" --host 0.0.0.0 --port 30000
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    volumes:
      - ~/.cache/huggingface:/root/.cache/huggingface
