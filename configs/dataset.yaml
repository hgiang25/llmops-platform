# =============================================================
# Dataset Configuration for LLM Router
# =============================================================
# Controls dataset source, label construction, and sampling.
# IMPORTANT: UltraFeedback scores are on scale 1-5 (NOT 1-10).

# --- Dataset Sources ---
sources:
  ultrafeedback:
    name: "openbmb/UltraFeedback"
    enabled: true
    streaming: false          # UltraFeedback is ~600MB, fits in RAM
    description: "GPT-4 annotated multi-model completions (64K prompts, 17 models)"

  chatbot_arena:
    name: "lmsys/lmsys-arena-human-preference-55k"
    enabled: false            # Enable when HuggingFace access is granted
    streaming: false
    description: "Human preference pairwise battles (55K battles)"

# --- Model Tier Classification ---
# UltraFeedback contains responses from 17 models.
# We cluster them into 3 tiers based on known capability.
#
# Tier assignment rationale:
#   weak:   ≤13B general-purpose, limited instruction-following
#   medium: 13B-70B or specialized/fine-tuned models
#   strong: Frontier models with consistently high performance
#
# Note: pythia-12b has only ~39 records in dataset (very low coverage).
#       bard has ~450 records. All others have ~480-530 records.
model_tiers:
  weak:
    - "alpaca-7b"
    - "wizardlm-7b"
    - "llama-2-7b-chat"        # 7B, limited capability
    - "pythia-12b"             # Only ~39 records, low impact
    - "oasst-pythia-12b"
    - "dolly-v2-12b"
    - "starchat"
  medium:
    - "llama-2-13b-chat"
    - "wizardlm-13b"
    - "vicuna-33b-v1.3"
    - "falcon-40b-instruct"    # 40B, medium capability
    - "mpt-30b-chat"
    - "ultralm-13b"
    - "ultralm-65b"
    - "gpt-3.5-turbo"          # Strong but not frontier-tier
  strong:
    - "gpt-4"
    - "bard"                   # Google frontier model (~450 records)
    - "llama-2-70b-chat"
    - "wizardlm-70b"

# --- Label Construction ---
labeling:
  # Method: "minimum_sufficient_model" (recommended)
  #       | "ultrafeedback_score" (legacy, uses overall_score directly)
  #       | "mock_length" (baseline only)
  method: "minimum_sufficient_model"

  # Quality threshold on scale 1-5
  # A model tier is "sufficient" if its best score >= this threshold
  # 4.0 ≈ "Good" on the 5-point scale
  quality_threshold: 4.0

  # Confidence margin on scale 1-5
  # If weak_score >= threshold but (strong_score - weak_score) > margin,
  # we upscale the label (weak is technically sufficient but strong is
  # meaningfully better, suggesting the prompt benefits from a stronger model)
  confidence_margin: 0.75

  # Threshold candidates for sensitivity analysis
  threshold_candidates: [3.0, 3.5, 4.0, 4.5]

  # Score aggregation from 4 UltraFeedback dimensions
  # Each dimension is scored 1-5 by GPT-4
  score_aggregation:
    method: "weighted"          # "weighted" | "mean" | "overall_score_only"
    weights:
      helpfulness: 0.30
      instruction_following: 0.25
      truthfulness: 0.25
      honesty: 0.20
    fallback: "available_mean"  # When a dimension is missing, redistribute weight

  # How to compute the representative score for each tier
  # "best": use max score across all models in that tier (optimistic)
  # "mean": use mean score across all models in that tier (conservative)
  tier_score_method: "best"

  # How to handle prompts where some tiers have no models sampled
  # "skip": discard the prompt entirely
  # "label_from_available": assign label using only available tiers
  missing_tier_strategy: "label_from_available"

  # Legacy: score field for "ultrafeedback_score" method
  score_field: "overall_score"

  # How to handle ties / ambiguous cases
  tie_breaking: "favor_weak"  # "favor_weak" | "favor_strong"

  # Label names and their integer mapping
  label_map:
    weak: 0
    medium: 1
    strong: 2

  # For mock baseline labels (used in experiments only)
  mock:
    short_threshold: 50       # chars
    medium_threshold: 150     # chars

# --- Data Paths ---
paths:
  raw_dir: "data/raw"
  interim_dir: "data/interim"
  processed_dir: "data/processed"
  labeled_dir: "data/labeled"
  splits_dir: "data/splits"
  metadata_dir: "data/metadata"

# --- Cleaning ---
cleaning:
  min_prompt_length: 10        # chars
  max_prompt_length: 4096      # chars
  min_prompt_words: 3
  remove_empty: true
  remove_non_english: false    # Keep all languages for now
  normalize_whitespace: true

# --- Deduplication ---
deduplication:
  exact_match: true
  near_duplicate: true
  near_duplicate_threshold: 0.85  # Jaccard similarity threshold

# --- Sampling ---
sampling:
  max_samples: 5000           # Total samples after sampling
  strategy: "stratified"      # "stratified" | "random" | "balanced"
  random_seed: 42

  # For balanced sampling
  balancing:
    method: "undersample"     # "undersample" | "oversample" | "class_weights"

# --- Train/Val/Test Split ---
split:
  train_ratio: 0.70
  val_ratio: 0.15
  test_ratio: 0.15
  random_seed: 42
  stratify: true              # Stratified split by label

# --- Dataset Versioning ---
versioning:
  current_version: "v2.0"
  description: "Minimum Sufficient Model labels from UltraFeedback (scale 1-5) with weighted score aggregation"
