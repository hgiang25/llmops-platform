# =============================================================
# Training Configuration for LLM Router
# =============================================================
# Optimized for RTX 4050 Laptop GPU (~6GB VRAM)

model:
  base_model: "Qwen/Qwen2.5-0.5B"
  num_labels: 3
  quant_type: "nf4"
  double_quant: true
  compute_dtype: "bfloat16"

lora:
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules:
    - "q_proj"
    - "k_proj"
    - "v_proj"
    - "o_proj"
  bias: "none"
  task_type: "SEQ_CLS"

training:
  num_epochs: 3
  per_device_train_batch_size: 2      # Reduced for 6GB VRAM
  per_device_eval_batch_size: 4
  gradient_accumulation_steps: 8      # Effective batch size = 2*8 = 16
  learning_rate: 2.0e-4
  weight_decay: 0.01
  warmup_ratio: 0.1
  lr_scheduler_type: "cosine"
  max_seq_length: 512                 # Reduced for VRAM. Most prompts < 512 tokens
  logging_steps: 10
  eval_strategy: "epoch"
  save_strategy: "epoch"
  load_best_model_at_end: true
  metric_for_best_model: "eval_f1_macro"
  greater_is_better: true
  bf16: true
  fp16: false
  output_dir: "models/cloudops-llm-adapter"
  report_to: "none"

dataset:
  train_path: "data/splits/train.jsonl"
  val_path: "data/splits/val.jsonl"
  test_path: "data/splits/test.jsonl"
  format: "jsonl"

# Resource monitoring
resource_monitoring:
  log_gpu_memory: true
  log_cpu_ram: true
  log_training_time: true
  log_samples_per_sec: true
  log_tokens_per_sec: true

# Input format template for the model
input_template: |
  Classify the following user query into the appropriate model tier.
  0 = Simple (weak model sufficient)
  1 = Moderate (medium model needed)
  2 = Complex (strong model required)

  Query: {query}

  Classification:

# MLflow integration
mlflow:
  tracking_uri: "http://localhost:5000"
  experiment_name: "llm-router-finetuning"

# Experiment matrix
experiments:
  dataset_sizes: [500, 1000, 3000, 5000]
  label_methods: ["ultrafeedback_score", "mock_length"]
