# =============================================================
# Training Configuration for LLM Router
# =============================================================
# Supports two architectures:
#   1. DeBERTa-v3-base + Ordinal Classification (recommended)
#   2. Qwen2.5-0.5B + QLoRA Standard Classification (baseline)
# Optimized for RTX 4050 Laptop GPU (~6GB VRAM)

# --- Active Model Configuration ---
# Switch architecture by changing "architecture" field
model:
  base_model: "microsoft/deberta-v3-base"
  architecture: "ordinal_classification"  # "ordinal_classification" | "standard_classification"
  num_labels: 3

  # Ordinal classification head config (used when architecture = "ordinal_classification")
  ordinal_head:
    hidden_dim: 256
    n_thresholds: 2            # K-1 = 2 for 3 classes (P(Y≥1), P(Y≥2))
    dropout: 0.1
    activation: "sigmoid"

# --- Alternative Model (for comparison experiments) ---
model_alternatives:
  qlora_baseline:
    base_model: "Qwen/Qwen2.5-0.5B"
    architecture: "standard_classification"
    num_labels: 3
    quant_type: "nf4"
    double_quant: true
    compute_dtype: "bfloat16"

# --- LoRA Config (used only for QLoRA baseline) ---
lora:
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules:
    - "q_proj"
    - "k_proj"
    - "v_proj"
    - "o_proj"
  modules_to_save:                 # CRITICAL: Save classification head weights
    - "score"                      # Without this, score layer is random at inference
  bias: "none"
  task_type: "SEQ_CLS"

# --- Training Hyperparameters ---
training:
  num_epochs: 15
  per_device_train_batch_size: 4      # Reduced for 6GB VRAM
  per_device_eval_batch_size: 8
  gradient_accumulation_steps: 4      # Effective batch size = 4*4 = 16
  learning_rate: 1.0e-4               # LoRA allows higher LR safely
  use_lora: true                      # Enable LoRA for DeBERTa
  weight_decay: 0.01
  warmup_ratio: 0.1
  lr_scheduler_type: "cosine"
  max_grad_norm: 1.0                  # Explicit gradient clipping
  adam_epsilon: 1e-6                  # Prevent division by zero in AdamW
  max_seq_length: 256
  logging_steps: 10
  eval_strategy: "epoch"
  save_strategy: "epoch"
  load_best_model_at_end: true
  metric_for_best_model: "eval_f1_macro"
  greater_is_better: true
  bf16: false
  fp16: false
  output_dir: "models/deberta-router"
  report_to: "none"

dataset:
  train_path: "data/splits/train.jsonl"
  val_path: "data/splits/val.jsonl"
  test_path: "data/splits/test.jsonl"
  format: "jsonl"

# Resource monitoring
resource_monitoring:
  log_gpu_memory: true
  log_cpu_ram: true
  log_training_time: true
  log_samples_per_sec: true
  log_tokens_per_sec: true

# MLflow integration
mlflow:
  tracking_uri: "http://localhost:5000"
  experiment_name: "llm-router-finetuning"

# Experiment matrix
experiments:
  dataset_sizes: [500, 1000, 3000, 5000]
  label_methods: ["minimum_sufficient_model", "ultrafeedback_score", "mock_length"]
  architectures: ["ordinal_classification", "standard_classification"]
